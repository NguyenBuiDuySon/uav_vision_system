[project]
name = "uav-vision-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "NguyenBuiDuySon", email = "nguyenbuiduyson27@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "pupil-apriltags>=1.0.4.post11",
    "pydantic>=2.13.5",
    "pyserial>=3.5",
    "rich>=15.0.0",
]

[project.scripts]
uav-vision-system = "uav_vision_system:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]
